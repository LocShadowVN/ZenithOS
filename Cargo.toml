[package]
name = "zenith-os"
version = "0.4.0"
edition = "2021"
authors = ["ZenithOS Contributors"]
description = "ZenithOS - 100% Rust Framekernel Operating System with Linux & Windows ABI Compatibility"
license = "GPL-3.0-only"

[[bin]]
name = "zenith-kernel"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"
opt-level = 1
debug = false
codegen-units = 16
incremental = false

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
