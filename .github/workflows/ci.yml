name: ZenithOS CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

env:
  CARGO_TERM_COLOR: always
  LIMINE_VERSION: "v8.7.0-binary"

jobs:
  build-and-qemu-test:
    name: Build and Boot ZenithOS (x86_64 QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy
          targets: x86_64-unknown-none

      - name: Cache Cargo and build-std Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Cache Limine Bootloader Binary
        id: cache-limine
        uses: actions/cache@v4
        with:
          path: /tmp/limine
          key: limine-bin-${{ env.LIMINE_VERSION }}

      - name: Install QEMU and ISO Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            xorriso \
            mtools

      - name: Fetch and Build Limine CLI
        if: steps.cache-limine.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/limine-bootloader/limine.git --branch=${{ env.LIMINE_VERSION }} --depth=1 /tmp/limine
          make -C /tmp/limine

      - name: Compile C Userland App with GCC and Package Debian 13 (.deb)
        run: |
          gcc -O2 -ffreestanding -nostdlib -fno-pie -no-pie \
            -mno-mmx -mno-sse -mno-sse2 -mno-red-zone \
            -fno-stack-protector -fno-asynchronous-unwind-tables \
            -Wl,-e,_start -Wl,-Ttext=0x00501000 -Wl,-z,max-page-size=0x1000 \
            -Wl,--build-id=none \
            userland/hello_trixie.c -o userland/hello-deb.elf
          strip --strip-all userland/hello-deb.elf

          python3 - << 'EOF'
          with open("userland/hello-deb.elf", "rb") as f:
              elf_data = f.read()
          assert elf_data[:4] == b"\x7fELF", "Invalid ELF binary generated by GCC"
          assert len(elf_data) <= 16384, f"ELF binary too large: {len(elf_data)}"

          deb = bytearray(b" " * (256 + len(elf_data)))
          deb[0:8] = b"!<arch>\n"
          deb[8:24] = b"debian-binary   "
          deb[56:60] = b"4   "
          deb[66:68] = b"`\n"
          deb[68:72] = b"2.0\n"

          deb[72:88] = b"control.tar     "
          deb[120:124] = b"64  "
          deb[130:132] = b"`\n"
          deb[132:196] = b"Package: hello-trixie\nVersion: 1.0\nArchitecture: amd64\nSuite:13\n"

          deb[196:212] = b"data.tar        "
          size_str = f"{len(elf_data):<10}".encode("ascii")
          deb[244:254] = size_str
          deb[254:256] = b"`\n"
          deb[256:256 + len(elf_data)] = elf_data

          with open("userland/hello-trixie.deb", "wb") as f:
              f.write(deb)
          print(f"[INFO] Packaged GCC ELF64 ({len(elf_data)} bytes) into userland/hello-trixie.deb")
          EOF

      - name: Auto-Format and Static Analysis (Clippy)
        run: |
          cargo fmt --all
          cargo clippy -- -D warnings

      - name: Build ZenithOS Kernel
        run: cargo build

      - name: Package Bootable ZenithOS ISO
        run: |
          mkdir -p iso_root/boot/limine
          cp target/x86_64-unknown-none/debug/zenith-kernel iso_root/boot/
          cat << 'EOF' > iso_root/boot/limine/limine.conf
          timeout: 0
          /ZenithOS
              protocol: limine
              kernel_path: boot():/boot/zenith-kernel
          EOF
          cp /tmp/limine/limine-bios.sys \
             /tmp/limine/limine-bios-cd.bin \
             /tmp/limine/limine-uefi-cd.bin \
             iso_root/boot/limine/
          xorriso -as mkisofs -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            iso_root -o zenith-os.iso
          /tmp/limine/limine bios-install zenith-os.iso

      - name: Run Automated Kernel Verification in QEMU
        run: |
          set +e
          timeout 15s qemu-system-x86_64 \
            -M q35 \
            -cpu max \
            -m 128M \
            -cdrom zenith-os.iso \
            -display none \
            -serial stdio \
            -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 33 ]; then
            echo "[PASS] ZenithOS booted and passed all verification tests."
          else
            echo "[FAIL] ZenithOS QEMU verification failed with exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Capture Hardware Framebuffer Screenshot (PNG)
        run: |
          (sleep 2; echo "screendump /tmp/fbcon.ppm"; sleep 1; echo "quit") | \
          qemu-system-x86_64 \
            -M q35 \
            -cpu max \
            -m 128M \
            -cdrom zenith-os.iso \
            -display none \
            -monitor stdio \
            -no-reboot >/dev/null 2>&1 || true

          python3 - << 'EOF'
          import struct, zlib
          with open("/tmp/fbcon.ppm", "rb") as f:
              _magic = f.readline()
              dims = f.readline()
              while dims.startswith(b"#"):
                  dims = f.readline()
              w, h = map(int, dims.split())
              _maxval = f.readline()
              rgb = f.read(w * h * 3)
          raw_rows = b"".join(b"\x00" + rgb[y * w * 3:(y + 1) * w * 3] for y in range(h))
          def chunk(tag, data):
              crc = zlib.crc32(tag + data) & 0xffffffff
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw_rows, 6))
              + chunk(b"IEND", b"")
          )
          with open("zenith-fbcon-screen.png", "wb") as f:
              f.write(png)
          print(f"[INFO] Captured framebuffer screenshot: {w}x{h} -> zenith-fbcon-screen.png")
          EOF

      - name: Upload Framebuffer Screenshot and Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: zenith-os-build-and-screen
          path: |
            zenith-fbcon-screen.png
            zenith-os.iso
          retention-days: 7
